name: Build Fabric

on:
  pull_request:
  workflow_dispatch:
  push:

concurrency:
  group: fabric-${{ github.head_ref || format('{0}-{1}', github.ref, github.run_number) }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.version }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version: ["26.1", "26.2", "26.3", "1.21.11", "1.21.10", "1.21.8", "1.21.5", "1.21.4", "1.21.1"]

    defaults:
      run:
        working-directory: fabric-modern

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 and 25
        uses: actions/setup-java@v4
        with:
          java-version: |
            21
            25
          distribution: temurin

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            fabric-modern/.gradle/loom-cache
          key: ${{ runner.os }}-fabric-${{ matrix.version }}-${{ hashFiles('fabric-modern/**/*.gradle*', 'fabric-modern/**/*.toml', 'fabric-modern/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-fabric-${{ matrix.version }}-
            ${{ runner.os }}-fabric-

      - name: Chmod Gradle
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew ":${{ matrix.version }}:build" --no-daemon
